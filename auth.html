<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - AODA Store</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{'warm-white':'#FEFCF8','oat':'#F5F1E8','fog-gray':'#E8E5E0','charcoal':'#2C2C2C','sage':'#A8B5A0'},fontFamily:{'display':['Playfair Display','serif'],'body':['DM Sans','sans-serif']}}}}</script>
    <link rel="icon" type="image/svg+xml" href="resources/favicon.svg">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#FEFCF8 0%,#F5F1E8 100%);color:#2C2C2C;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .auth-container{width:100%;max-width:420px;padding:2rem}
        .auth-card{background:white;border-radius:20px;padding:2.5rem;box-shadow:0 8px 30px rgba(0,0,0,0.08)}
        .auth-logo{text-align:center;margin-bottom:1.75rem}
        .auth-logo a{text-decoration:none;color:#2C2C2C}
        .auth-logo h1{font-family:'Playfair Display',serif;font-size:1.8rem}
        .auth-logo p{font-size:0.85rem;color:#999;margin-top:0.25rem}
        .auth-message{text-align:center;padding:0.75rem;border-radius:8px;font-size:0.9rem;margin-bottom:1rem;display:none}
        .auth-message.success{background:#d4edda;color:#155724;display:block}
        .auth-message.error{background:#f8d7da;color:#721c24;display:block}
        .auth-message.info{background:#f0f4ef;color:#4a5c46;display:block}
        .auth-tabs{display:flex;margin-bottom:1.75rem;background:#F5F1E8;border-radius:10px;padding:4px}
        .auth-tab{flex:1;padding:0.6rem;text-align:center;border-radius:8px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:0.9rem;font-weight:500;color:#999;transition:all 0.2s}
        .auth-tab.active{background:white;color:#2C2C2C;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
        .auth-form{display:none}.auth-form.active{display:block}
        .form-group{margin-bottom:1.25rem}
        .form-label{display:block;font-size:0.85rem;font-weight:500;color:#555;margin-bottom:0.35rem}
        .form-label .req{color:#ff6b6b}
        .form-input{width:100%;padding:0.75rem 1rem;border:1.5px solid #E8E5E0;border-radius:10px;font-size:0.95rem;font-family:inherit;outline:none;transition:border 0.3s,box-shadow 0.3s;color:#2C2C2C;background:white}
        .form-input:focus{border-color:#A8B5A0;box-shadow:0 0 0 3px rgba(168,181,160,0.15)}
        .form-input.error{border-color:#ff6b6b}
        .field-error{font-size:0.8rem;color:#ff6b6b;min-height:1.1rem}
        .auth-btn{width:100%;padding:0.85rem;background:#A8B5A0;color:white;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:inherit}
        .auth-btn:hover{background:#96a388;transform:translateY(-1px);box-shadow:0 6px 20px rgba(168,181,160,0.3)}
        .auth-btn:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none}
        .auth-footer{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:#999}
        .auth-footer a{color:#A8B5A0;text-decoration:none;font-weight:500}
        .auth-footer a:hover{text-decoration:underline}
        .password-wrapper{position:relative}
        .toggle-password{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;padding:4px}
        .toggle-password:hover{color:#2C2C2C}
        .redirect-info{margin-top:1rem;padding:0.85rem 1rem;background:#f0f4ef;border-radius:10px;font-size:0.8rem;color:#555;line-height:1.5}
        .redirect-info strong{color:#A8B5A0}
        @media(max-width:480px){.auth-container{padding:1rem}.auth-card{padding:1.5rem}}
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html">
                    <h1>AODA Store</h1>
                    <p>Entrar na tua conta</p>
                </a>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Entrar</button>
                <button class="auth-tab" onclick="switchTab('register')">Criar Conta</button>
            </div>

            <!-- ====== LOGIN (unificado — redireciona por role) ====== -->
            <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">E-mail <span class="req">*</span></label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="exemplo@email.com" required>
                    <div class="field-error" id="loginEmail-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Palavra-passe <span class="req">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="loginPassword" placeholder="Mínimo 6 caracteres" required minlength="6" style="padding-right:40px">
                        <button type="button" class="toggle-password" onclick="togglePw('loginPassword',this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="1"/></svg>
                        </button>
                    </div>
                    <div class="field-error" id="loginPassword-error"></div>
                </div>
                <button type="submit" class="auth-btn" id="loginBtn">Entrar</button>

                <div class="redirect-info">
                    Após o login o sistema redireciona automaticamente:<br>
                    <strong>Clientes</strong> → Minha Conta &nbsp;|&nbsp; <strong>Administradores</strong> → Painel Admin
                </div>

                <div class="auth-footer">
                    <a href="#" onclick="switchTab('reset')">Esqueceste a palavra-passe?</a>
                </div>
            </form>

            <!-- ====== REGISTO (só clientes) ====== -->
            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">Nome Completo <span class="req">*</span></label>
                    <input type="text" class="form-input" id="regName" placeholder="O teu nome" required>
                    <div class="field-error" id="regName-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail <span class="req">*</span></label>
                    <input type="email" class="form-input" id="regEmail" placeholder="exemplo@email.com" required>
                    <div class="field-error" id="regEmail-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Telefone</label>
                    <input type="tel" class="form-input" id="regPhone" placeholder="923 456 789 (opcional)">
                </div>
                <div class="form-group">
                    <label class="form-label">Palavra-passe <span class="req">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" style="padding-right:40px">
                        <button type="button" class="toggle-password" onclick="togglePw('regPassword',this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="1"/></svg>
                        </button>
                    </div>
                    <div class="field-error" id="regPassword-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar Palavra-passe <span class="req">*</span></label>
                    <input type="password" class="form-input" id="regConfirm" placeholder="Repete a palavra-passe" required minlength="6">
                    <div class="field-error" id="regConfirm-error"></div>
                </div>
                <button type="submit" class="auth-btn" id="regBtn">Criar Conta</button>
                <div class="auth-footer">Já tens conta? <a href="#" onclick="switchTab('login')">Entrar</a></div>
            </form>

            <!-- ====== RESET PASSWORD ====== -->
            <form class="auth-form" id="resetForm" onsubmit="handleReset(event)">
                <p style="color:#666;font-size:0.9rem;margin-bottom:1.5rem;text-align:center">Introduz o teu e-mail e enviaremos um link para redefinir a palavra-passe.</p>
                <div class="form-group">
                    <label class="form-label">E-mail <span class="req">*</span></label>
                    <input type="email" class="form-input" id="resetEmail" placeholder="exemplo@email.com" required>
                    <div class="field-error" id="resetEmail-error"></div>
                </div>
                <button type="submit" class="auth-btn" id="resetBtn">Enviar Link de Reset</button>
                <div class="auth-footer"><a href="#" onclick="switchTab('login')">Voltar ao Login</a></div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth-service.js"></script>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-form').forEach(function(f){f.classList.remove('active')});
            document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.remove('active')});
            if (tab==='login') { document.getElementById('loginForm').classList.add('active'); document.querySelectorAll('.auth-tab')[0].classList.add('active'); }
            else if (tab==='register') { document.getElementById('registerForm').classList.add('active'); document.querySelectorAll('.auth-tab')[1].classList.add('active'); }
            else if (tab==='reset') { document.getElementById('resetForm').classList.add('active'); }
            hideMsg(); clearErrors();
        }

        function togglePw(id, btn) {
            var inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        function showMsg(t,cls) { var e=document.getElementById('authMessage'); e.textContent=t; e.className='auth-message '+cls; }
        function hideMsg() { var e=document.getElementById('authMessage'); e.className='auth-message'; e.textContent=''; }
        function clearErrors() { document.querySelectorAll('.field-error').forEach(function(e){e.textContent=''}); document.querySelectorAll('.form-input').forEach(function(i){i.classList.remove('error')}); }
        function showErr(id,msg) { document.getElementById(id+'-error').textContent=msg; document.getElementById(id).classList.add('error'); }

        // Se chegou aqui a partir de admin.html sem sessão de admin, mostra aviso
        // (o redirecionamento por role continua automático após o login)
        (function(){
            var params = new URLSearchParams(window.location.search);
            if (params.get('redirect') === 'admin') {
                showMsg('Inicia sessão com uma conta de administrador para aceder ao painel.', 'info');
            }
        })();

        // LOGIN UNIFICADO — redireciona por role
        async function handleLogin(e) {
            e.preventDefault(); hideMsg(); clearErrors();
            var email = document.getElementById('loginEmail').value.trim();
            var pw = document.getElementById('loginPassword').value;
            if (!email||!pw) { if(!email) showErr('loginEmail','Obrigatório'); if(!pw) showErr('loginPassword','Obrigatória'); return; }

            var btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'A entrar...';

            var result = await AuthService.loginAndRedirect(email, pw);

            if (result.success) {
                showMsg('Login bem-sucedido! A redirecionar...', 'success');
                setTimeout(function() { window.location.href = result.redirect; }, 800);
            } else {
                btn.disabled = false; btn.textContent = 'Entrar';
                showMsg(result.error, 'error');
                if (result.error.indexOf('e-mail')!==-1) showErr('loginEmail', result.error);
                else if (result.error.indexOf('passe')!==-1) showErr('loginPassword', result.error);
            }
        }

        // REGISTO (cliente)
        async function handleRegister(e) {
            e.preventDefault(); hideMsg(); clearErrors();
            var name=document.getElementById('regName').value.trim(), email=document.getElementById('regEmail').value.trim(),
                phone=document.getElementById('regPhone').value.trim(), pw=document.getElementById('regPassword').value,
                confirm=document.getElementById('regConfirm').value, ok=true;
            if(!name){showErr('regName','Obrigatório');ok=false} if(!email){showErr('regEmail','Obrigatório');ok=false}
            if(pw.length<6){showErr('regPassword','Mínimo 6 caracteres');ok=false} if(pw!==confirm){showErr('regConfirm','Não coincidem');ok=false}
            if(!ok) return;

            var btn=document.getElementById('regBtn'); btn.disabled=true; btn.textContent='A criar conta...';
            var result = await AuthService.register(name, email, pw, phone);
            if(result.success) { showMsg('Conta criada! A redirecionar...','success'); setTimeout(function(){window.location.href='account.html'},800); }
            else { btn.disabled=false; btn.textContent='Criar Conta'; showMsg(result.error,'error'); }
        }

        // RESET
        async function handleReset(e) {
            e.preventDefault(); hideMsg(); clearErrors();
            var email=document.getElementById('resetEmail').value.trim();
            if(!email){showErr('resetEmail','Obrigatório');return}
            var btn=document.getElementById('resetBtn'); btn.disabled=true; btn.textContent='A enviar...';
            var result = await AuthService.resetPassword(email);
            btn.disabled=false; btn.textContent='Enviar Link de Reset';
            if(result.success) showMsg(result.message,'success'); else { showMsg(result.error,'error'); if(result.error.indexOf('e-mail')!==-1) showErr('resetEmail',result.error); }
        }
    </script>
    <script src="shared-ux.js"></script>
    <script>document.addEventListener('DOMContentLoaded',function(){SharedUX.initImageFallbacks()});</script>
    <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js")}</script>
</body>
</html>
