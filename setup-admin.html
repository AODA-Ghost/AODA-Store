<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Admin - AODA Store</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#FEFCF8,#F5F1E8);color:#2C2C2C;min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.6}
        .box{background:white;border-radius:20px;padding:2.5rem;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:540px;width:90%}
        h1{font-family:'Playfair Display',serif;font-size:1.6rem;text-align:center;margin-bottom:.5rem}
        .sub{text-align:center;color:#999;font-size:.85rem;margin-bottom:1.5rem}
        .warn{background:#fff3cd;border:1px solid #ffc107;padding:1rem;border-radius:10px;font-size:.82rem;color:#856404;margin-bottom:1.5rem;line-height:1.5}
        .warn code{background:#eee;padding:.1rem .3rem;border-radius:4px;font-size:.8rem}
        .fg{margin-bottom:1.1rem}
        .fl{display:block;font-size:.85rem;font-weight:500;color:#555;margin-bottom:.3rem}
        .fi{width:100%;padding:.75rem 1rem;border:1.5px solid #E8E5E0;border-radius:10px;font-size:.95rem;font-family:inherit;outline:none;color:#2C2C2C;background:white}
        .fi:focus{border-color:#A8B5A0}
        .btn{width:100%;padding:.85rem;background:#2C2C2C;color:white;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:.5rem}
        .btn:hover{background:#444}
        .btn:disabled{background:#999;cursor:not-allowed}
        .sr{margin-top:1rem;padding:.85rem 1rem;border-radius:10px;font-size:.88rem;display:none}
        .sr.error{display:block;background:#f8d7da;color:#721c24}
        .sr.success{display:block;background:#d4edda;color:#155724}
        .sr.info{display:block;background:#d1ecf1;color:#0c5460}
    </style>
</head>
<body>
    <div class="box">
        <h1>Configurar Administrador</h1>
        <p class="sub">Cria a primeira conta de administrador</p>
        <div class="warn">
            <strong>Passo prévio nas Firestore Rules:</strong><br>
            Muda temporariamente a regra de <code>/users/{uid}</code> create para:<br>
            <code>allow create: if isAuthenticated() && uid == request.auth.uid;</code><br>
            Após criar o admin, <strong>restaura a regra original</strong> e faz deploy.
        </div>
        <div id="sResult" class="sr"></div>
        <form onsubmit="createAdmin(event)">
            <div class="fg"><label class="fl">Nome</label><input type="text" class="fi" id="sName" required></div>
            <div class="fg"><label class="fl">E-mail</label><input type="email" class="fi" id="sEmail" placeholder="admin@aodastore.co.ao" required></div>
            <div class="fg"><label class="fl">Palavra-passe</label><input type="password" class="fi" id="sPassword" required minlength="6"></div>
            <button type="submit" class="btn" id="sBtn">Criar Administrador</button>
        </form>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="setup-admin.js"></script>
</body>
</html>
